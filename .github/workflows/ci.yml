---
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Run repository checks
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure
      - name: Validate consumer examples
        run: uv run pytest tests/test_consumer_examples.py
      - name: Run tests
        run: |
          mkdir -p artifacts
          uv run pytest --junitxml=artifacts/junit.xml
      - name: Build wheel and source distribution
        run: uv build --no-sources --out-dir artifacts/dist
      - name: Verify installed wheel
        run: |
          uv venv --python 3.12 .wheel-venv
          uv pip install --python .wheel-venv/bin/python artifacts/dist/*.whl
          .wheel-venv/bin/python - <<'PY'
          from robotics_runtime_contracts import load_schema, schema_names, schema_path
          from importlib.resources import files

          assert schema_names()
          assert files("robotics_runtime_contracts").joinpath("py.typed").is_file()
          for name in schema_names():
              assert schema_path(name).is_file()
              assert load_schema(name)["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          PY
      - name: Verify installed source distribution
        run: |
          uv venv --python 3.12 .sdist-venv
          uv pip install --python .sdist-venv/bin/python artifacts/dist/*.tar.gz
          .sdist-venv/bin/python - <<'PY'
          from robotics_runtime_contracts import schema_names, schema_path

          assert schema_names()
          assert all(schema_path(name).is_file() for name in schema_names())
          PY
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: contracts-validation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
