---
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install package and validation tools
        run: |
          make sync-schemas
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run validation
        run: make ci
      - name: Package import smoke
        run: >-
          python -c "from robotics_runtime_contracts import schema_path;
          print(schema_path('stack-lock.v1.schema.json'))"
      - name: Notify infra cross-repo gate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/foundation-ready-v0.2')
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [[ -z "${CROSS_REPO_TOKEN}" ]]; then
            echo "CROSS_REPO_TOKEN missing; skip repository_dispatch"
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CROSS_REPO_TOKEN}" \
            "https://api.github.com/repos/mmkolpakov/droning-simulation-infra/dispatches" \
            -d '{"event_type":"contracts-ci-success","client_payload":{"sha":"'"${GITHUB_SHA}"'"}}'
