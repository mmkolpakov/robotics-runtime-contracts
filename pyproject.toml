[project]
name = "robotics-runtime-contracts"
version = "0.16.0"
description = "Canonical acceptance and evidence contracts for robotics runtimes."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = ["robotics", "ros2", "json-schema", "simulation", "acceptance-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "json-merge-patch==0.3.0",
  "jsonschema[format-nongpl]>=4.26,<5",
  "PyYAML>=6.0.3,<7",
  "referencing>=0.37,<0.38",
]

[project.scripts]
robotics-contracts = "robotics_runtime_contracts.cli:main"

[project.urls]
Homepage = "https://github.com/mmkolpakov/robotics-runtime-contracts"
Repository = "https://github.com/mmkolpakov/robotics-runtime-contracts"
Issues = "https://github.com/mmkolpakov/robotics-runtime-contracts/issues"

[dependency-groups]
dev = [
  "check-jsonschema==0.37.4",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260518",
  "yamllint==1.38.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotics_runtime_contracts"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/robotics_runtime_contracts"]
