[project]
name = "robotics-runtime-contracts"
version = "0.1.0"
description = "Runtime contract schemas for robotics simulation projects."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
