[project]
name = "robotics-runtime-contracts"
version = "0.3.0"
description = "Portable acceptance-scenario contract for robotics runtimes."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
  "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = [
  "check-jsonschema==0.37.4",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pyyaml>=6.0.2,<7",
  "ruff==0.15.21",
  "yamllint==1.38.0",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotics_runtime_contracts = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
