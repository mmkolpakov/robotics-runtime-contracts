[project]
name = "robotics-runtime-contracts"
version = "0.4.1"
description = "Versioned acceptance and evidence contracts for robotics runtimes."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = ["robotics", "ros2", "json-schema", "simulation", "acceptance-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4.26,<5",
]

[project.urls]
Homepage = "https://github.com/mmkolpakov/robotics-runtime-contracts"
Repository = "https://github.com/mmkolpakov/robotics-runtime-contracts"
Issues = "https://github.com/mmkolpakov/robotics-runtime-contracts/issues"

[dependency-groups]
dev = [
  "check-jsonschema==0.37.4",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pyyaml>=6.0.2,<7",
  "ruff==0.15.21",
  "yamllint==1.38.0",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotics_runtime_contracts = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
